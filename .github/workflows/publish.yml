name: publish

# npm trusted publishing (OIDC) — 토큰·시크릿 없이 npm 이 이 워크플로의 신원을 신뢰해 배포한다.
# npm 패키지 설정(Trusted Publisher)에 dolseom/gongsi-mcp + publish.yml 이 등록되어 있어야 한다.
#
# 배포 절차: package.json 버전 올려 커밋 → `git tag vX.Y.Z && git push origin vX.Y.Z`
# 검증만:   Actions 탭 → publish → Run workflow (dry_run 기본 true)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'npm publish --dry-run (실배포 없이 게이트·패키징만 검증)'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # OIDC 토큰 발급 — trusted publishing 의 전제

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # trusted publishing 은 npm 11.5.1 이상 필요 — 러너 번들 버전이 낮을 수 있어 갱신
      - run: npm install -g npm@latest

      - run: npm ci

      # 태그 배포일 때 태그 ↔ package.json 버전 일치 확인 (엇갈린 배포 방지)
      - if: github.ref_type == 'tag'
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "태그($GITHUB_REF_NAME)와 package.json($PKG) 버전이 다릅니다"
            exit 1
          fi

      # 배포 산출물 스모크 — 타르볼 설치본을 stdio 로 실기동해 프로토콜 왕복 확인
      - run: npm run build
      - run: node scripts/smoke-tarball.mjs

      # prepublishOnly 게이트(시크릿스캔→타입체크→테스트 344→빌드)는 npm publish 가 자동 실행한다.
      # CI 에는 .env 가 없으므로 시크릿스캔은 "대조값 없음 — 생략"으로 통과한다 (실게이트는 로컬 pre-commit).
      - if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --dry-run

      - if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        run: npm publish
