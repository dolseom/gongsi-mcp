name: test

# push/PR 마다 전체 게이트를 돌린다 — 배포일이 아니라 커밋일에 깨짐을 잡는다.
# 리눅스(배포 러너와 동일) + 윈도우(개발 환경과 동일) 양쪽에서 검증.

on:
  push:
    branches: ['main']
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # 배포 산출물 스모크 — 타르볼 설치본을 stdio 로 실기동해 프로토콜 왕복 확인
      - run: node scripts/smoke-tarball.mjs
